# Dependências locais opcionais. O desenvolvimento atual também pode usar scripts/start-postgres.mjs.
#
# Conceito de escala (não faz deploy):
#   web    → mesma imagem (target web), comando: npm run start
#   worker → mesma codebase (target worker), comando: npm run worker
# Ambos compartilham DATABASE_URL, REDIS_URL e storage S3/R2.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cliplab
      POSTGRES_PASSWORD: cliplab
      POSTGRES_DB: cliplab
    ports:
      - "5432:5432"
    volumes:
      - cliplab_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  # web:
  #   build: { context: ., target: web }
  #   env_file: .env.local
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, redis]
  # worker:
  #   build: { context: ., target: worker }
  #   env_file: .env.local
  #   command: npm run worker
  #   depends_on: [postgres, redis]
volumes:
  cliplab_pg:
